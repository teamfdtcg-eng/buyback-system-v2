<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAN-TYO TCG 批次上傳多頁買取系統 (Firebase 雲端同步版)</title>
  <!-- 引入 html2canvas 庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* --- 基礎佈局 --- */
    body {
      margin: 0;
      padding: 15px 10px 100px 10px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #1A1C4B 0%, #FF5E36 50%, #FFAE33 100%) fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 頂部控制面板 */
    .control-panel {
      position: fixed;
      top: 10px;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 9999;
      border: 1px solid #ff9900;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      color: #000;
      border: none;
      padding: 7px 15px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-add { background: #00b0ff; color: #fff; }
    .btn-save-draft { background: #e040fb; color: #fff; }
    .btn-load-draft { background: #00e676; color: #000; }
    .btn-auth { background: #4285F4; color: #fff; }
    .user-info { color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #fff; }

    /* 頁面包裹與海報主體 */
    .pages-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 60px;
      margin-top: 90px;
    }

    .page-setting-bar {
      background: #f5f5f5;
      padding: 8px 12px;
      border: 2px solid #000;
      border-bottom: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .page-setting-bar select {
      padding: 4px 8px;
      font-weight: bold;
      border: 2px solid #000;
      font-size: 12px;
    }

    .action-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .batch-upload-btn-wrapper {
      position: relative;
      background: #ff9900;
      color: #000;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 12px;
      border: 2px solid #000;
      border-radius: 4px;
    }

    .batch-upload-btn-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .btn-action {
      background: #fff;
      border: 2px solid #000;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-export-jpg { background: #ff007f; color: #fff; }
    .btn-delete-page { background: #ff3b30; color: #fff; }

    /* 海報核心樣式 */
    .poster-container {
      background-color: #fff;
      width: 100%;
      border: 6px solid #000;
      padding: 12px;
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 700px;
    }

    .logo-upload-area {
      width: 70px;
      height: 70px;
      background-color: #f0f0f0;
      border: 3px solid #000;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .logo-upload-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-placeholder {
      font-size: 9px;
      font-weight: bold;
      text-align: center;
      color: #666;
      line-height: 1.1;
      position: absolute;
    }

    .logo-upload-area input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 15;
      cursor: pointer;
    }

    .header-zone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    .date-badge {
      background-color: #d11a2a;
      color: #fff;
      padding: 4px 6px;
      font-size: 14px;
      font-weight: bold;
      border: 3px solid #000;
      text-align: center;
      min-width: 55px;
      box-sizing: border-box;
    }

    .date-badge span {
      display: block;
      font-size: 9px;
      background-color: #fff;
      color: #000;
      margin-top: 2px;
      padding: 1px;
    }

    .main-title {
      background: linear-gradient(180deg, #fff 0%, #ffcc00 40%, #ff9900 100%);
      border: 4px solid #000;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      flex-grow: 1;
      box-shadow: 0 3px 0 #bc7a00;
    }

    .main-title h1 {
      margin: 0;
      font-size: 28px;
      color: #e60012;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      letter-spacing: 2px;
      font-style: italic;
      line-height: 1;
    }

    .main-title .subtitle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      background-color: #000;
      padding: 1px 6px;
      display: inline-block;
    }

    @media (min-width: 600px) {
      .main-title h1 { font-size: 42px; }
      .logo-upload-area { width: 90px; height: 90px; }
      .header-zone { gap: 15px; }
    }

    /* 卡片網格 */
    .card-grid {
      display: grid;
      gap: 8px;
      background-color: #000;
      padding: 8px;
      border: 2px solid #000;
      flex: 1 1 auto;
      min-height: 0;
    }

    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); }
    .grid-12 { grid-template-columns: repeat(3, 1fr); }
    .grid-15 { grid-template-columns: repeat(3, 1fr); }

    @media (min-width: 600px) {
      .grid-12 { grid-template-columns: repeat(4, 1fr); }
      .grid-15 { grid-template-columns: repeat(5, 1fr); }
    }

    /* 卡片項目 (支援拖曳排序) */
    .card-item {
      background-color: #fff;
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-height: 0;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .card-item:active { cursor: grabbing; }
    .card-item.dragging { opacity: 0.4; transform: scale(0.95); border: 2px dashed #ff9900; }
    .card-item.drag-over { border: 3px solid #00b0ff !important; box-shadow: 0 0 10px #00b0ff; }

    .image-container {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      pointer-events: none;
    }

    .phone-upload-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border: 1.5px solid #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      z-index: 5;
    }

    .phone-upload-btn input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .card-info {
      background-color: #fff;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: bold;
      border-top: 2px solid #000;
      border-bottom: 2px solid #000;
      text-align: center;
      word-break: break-all;
      flex-shrink: 0;
      outline: none;
    }

    .price-tag {
      background-color: #fff900;
      color: #e60012;
      font-weight: 900;
      font-size: 20px;
      text-align: center;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .price-label {
      white-space: pre;
      background-color: #000;
      color: #fff;
      font-size: 8px;
      line-height: 1.1;
      padding: 2px;
      position: absolute;
      left: 2px;
      top: 2px;
      bottom: 2px;
      display: flex;
      align-items: center;
    }

    .price-tag-value {
      flex-grow: 1;
      text-align: center;
      outline: none;
    }

    .footer-notes {
      margin-top: 10px;
      background-color: #e60012;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 8px;
      text-align: center;
      border: 3px solid #000;
      flex-shrink: 0;
      outline: none;
    }

    .exporting-jpg .phone-upload-btn,
    .exporting-jpg .logo-placeholder {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div class="control-panel">
    <div id="authContainer">
      <button class="btn btn-auth" onclick="loginGoogle()">🔑 Google 登入</button>
    </div>
    <button class="btn btn-add" onclick="addNewPage()">+ 新增頁面</button>
    <button class="btn btn-save-draft" onclick="saveToCloud()">☁️ 儲存至雲端</button>
    <button class="btn btn-load-draft" onclick="loadFromCloud()">📂 載入雲端草稿</button>
    <button class="btn btn-save-draft" style="background:#ff3b30;" onclick="printAllPages()">🖨️ 全部列印</button>
  </div>

  <!-- 頁面容器區塊 -->
  <div class="pages-wrapper" id="pagesWrapper"></div>

  <!-- 載入 Firebase 模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 專屬 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyA5zUuN3v4UyRoHwrMPWtcOdKQaauoW2AY",
      authDomain: "bantyo-re-buy.firebaseapp.com",
      projectId: "bantyo-re-buy",
      storageBucket: "bantyo-re-buy.firebasestorage.app",
      messagingSenderId: "391788144220",
      appId: "1:391788144220:web:863aad7c65fbc73ad6e899",
      measurementId: "G-N33FP2EXYV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // 監聽 Google 登入狀態
    onAuthStateChanged(auth, (user) => {
      const authContainer = document.getElementById('authContainer');
      if (user) {
        currentUser = user;
        authContainer.innerHTML = `
          <div class="user-info">
            <img class="user-avatar" src="${user.photoURL}" />
            <span>${user.displayName}</span>
            <button class="btn-action" style="padding:2px 6px;" onclick="logoutGoogle()">登出</button>
          </div>
        `;
      } else {
        currentUser = null;
        authContainer.innerHTML = `<button class="btn btn-auth" onclick="loginGoogle()">🔑 Google 登入</button>`;
      }
    });

    // Google 登入
    window.loginGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
        alert('登入成功！');
      } catch (error) {
        console.error("登入失敗:", error);
        alert('登入失敗: ' + error.message);
      }
    };

    // 登出
    window.logoutGoogle = async function() {
      await signOut(auth);
      alert('已登出');
    };

    // 儲存至 Firebase 雲端
    window.saveToCloud = async function() {
      if (!currentUser) {
        alert('請先點擊「Google 登入」再進行雲端儲存！');
        return;
      }

      const pages = [];
      const pageBlocks = document.querySelectorAll('.page-block');

      pageBlocks.forEach(page => {
        const pageId = page.id;
        const gridSelect = page.querySelector('.page-setting-bar select');
        const gridType = gridSelect ? gridSelect.value : 'grid-12';

        const logoImg = page.querySelector('.logo-upload-area img');
        const logoSrc = (logoImg && logoImg.style.display !== 'none') ? logoImg.src : '';
        const mainTitle = page.querySelector('.main-title h1').innerText;
        const subtitle = page.querySelector('.main-title .subtitle').innerText;
        const dateText = page.querySelector('.date-badge div').innerText;
        const footerNotes = page.querySelector('.footer-notes').innerText;

        const cards = [];
        const cardItems = page.querySelectorAll('.card-item');
        cardItems.forEach(item => {
          const img = item.querySelector('.image-container img');
          const imgSrc = (img && img.style.display !== 'none') ? img.src : '';
          const name = item.querySelector('.card-info').innerText;
          const price = item.querySelector('.price-tag-value').innerText;

          cards.push({ imgSrc, name, price });
        });

        pages.push({
          gridType,
          logoSrc,
          mainTitle,
          subtitle,
          dateText,
          footerNotes,
          cards
        });
      });

      try {
        await setDoc(doc(db, "buyback_drafts", currentUser.uid), {
          updatedAt: new Date(),
          pages: pages
        });
        alert('草稿已成功同步上傳至雲端！');
      } catch (e) {
        console.error("雲端儲存錯誤:", e);
        alert('儲存失敗！如果圖片數量極多，建議控制圖片尺寸。');
      }
    };

    // 從 Firebase 載入雲端草稿
    window.loadFromCloud = async function() {
      if (!currentUser) {
        alert('請先點擊「Google 登入」！');
        return;
      }

      try {
        const docRef = doc(db, "buyback_drafts", currentUser.uid);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          alert('雲端中找不到你的草稿紀錄！');
          return;
        }

        if (!confirm('讀取雲端草稿將會覆蓋當前頁面，確定繼續？')) return;

        const data = docSnap.data();
        const pages = data.pages;
        const wrapper = document.getElementById('pagesWrapper');
        wrapper.innerHTML = '';
        pageCounter = 0;

        pages.forEach(pData => {
          pageCounter++;
          const pageId = `page-${pageCounter}`;
          const pageElement = document.createElement('div');
          pageElement.className = 'page-block';
          pageElement.id = pageId;

          pageElement.innerHTML = `
            <div class="page-setting-bar">
              <div class="action-group">
                <label>網格配置：</label>
                <select onchange="changeGrid('${pageId}', this.value)">
                  <option value="grid-1" ${pData.gridType==='grid-1'?'selected':''}>1 格</option>
                  <option value="grid-2" ${pData.gridType==='grid-2'?'selected':''}>2 格</option>
                  <option value="grid-4" ${pData.gridType==='grid-4'?'selected':''}>4 格</option>
                  <option value="grid-9" ${pData.gridType==='grid-9'?'selected':''}>9 格</option>
                  <option value="grid-12" ${pData.gridType==='grid-12'?'selected':''}>12 格</option>
                  <option value="grid-15" ${pData.gridType==='grid-15'?'selected':''}>15 格</option>
                </select>
              </div>
              <div class="action-group">
                <div class="batch-upload-btn-wrapper">
                  📷 批次上傳圖片
                  <input type="file" multiple accept="image/*" onchange="batchUploadImages('${pageId}', this)">
                </div>
                <button class="btn-action btn-export-jpg" onclick="exportToJPG('${pageId}')">🖼️ 導出 JPG</button>
                <button class="btn-action btn-delete-page" onclick="deletePage('${pageId}')">刪除頁面</button>
              </div>
            </div>
            <div class="poster-container" id="poster-${pageId}">
              <div class="header-zone">
                <div class="logo-upload-area">
                  <span class="logo-placeholder" style="${pData.logoSrc ? 'display:none;' : ''}">上傳 Logo</span>
                  <img src="${pData.logoSrc}" style="${pData.logoSrc ? 'display:block;' : 'display:none;'}" />
                  <input type="file" accept="image/*" onchange="uploadLogo(this)">
                </div>
                <div class="main-title">
                  <h1 contenteditable="true">${pData.mainTitle}</h1>
                  <div class="subtitle" contenteditable="true">${pData.subtitle}</div>
                </div>
                <div class="date-badge">
                  <div contenteditable="true">${pData.dateText}</div>
                  <span>更新</span>
                </div>
              </div>
              <div class="card-grid ${pData.gridType}" id="grid-${pageId}"></div>
              <div class="footer-notes" contenteditable="true">${pData.footerNotes}</div>
            </div>
          `;

          wrapper.appendChild(pageElement);

          const gridContainer = document.getElementById(`grid-${pageId}`);
          pData.cards.forEach(card => {
            const item = document.createElement('div');
            item.className = 'card-item';
            item.draggable = true;
            item.innerHTML = `
              <div class="image-container">
                <img src="${card.imgSrc}" style="${card.imgSrc ? 'display:block;' : 'display:none;'}" />
                <div class="phone-upload-btn">
                  📷 <input type="file" accept="image/*" onchange="uploadSingleCardImage(this)">
                </div>
              </div>
              <div class="card-info" contenteditable="true">${card.name}</div>
              <div class="price-tag">
                <div class="price-label">買取<br>HKD</div>
                <div class="price-tag-value" contenteditable="true">${card.price}</div>
              </div>
            `;
            bindDragEvents(item);
            gridContainer.appendChild(item);
          });
        });

        alert('已成功從雲端下載並恢復草稿！');
      } catch (e) {
        console.error("載入失敗:", e);
        alert('讀取草稿失敗！');
      }
    };
  </script>

  <script>
    let pageCounter = 0;

    // 圖片自動壓縮函式 (防止過大)
    function compressImage(file, callback) {
      const maxWidth = 800;
      const maxHeight = 800;
      const quality = 0.7;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function () {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
      };
    }

    function getTodayFormatted() {
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      return `${day}/${month}`;
    }

    function addNewPage(gridType = 'grid-12') {
      pageCounter++;
      const pageId = `page-${pageCounter}`;
      const wrapper = document.getElementById('pagesWrapper');
      const dateText = getTodayFormatted();

      const pageElement = document.createElement('div');
      pageElement.className = 'page-block';
      pageElement.id = pageId;

      pageElement.innerHTML = `
        <div class="page-setting-bar">
          <div class="action-group">
            <label>網格配置：</label>
            <select onchange="changeGrid('${pageId}', this.value)">
              <option value="grid-1" ${gridType==='grid-1'?'selected':''}>1 格</option>
              <option value="grid-2" ${gridType==='grid-2'?'selected':''}>2 格</option>
              <option value="grid-4" ${gridType==='grid-4'?'selected':''}>4 格</option>
              <option value="grid-9" ${gridType==='grid-9'?'selected':''}>9 格</option>
              <option value="grid-12" ${gridType==='grid-12'?'selected':''}>12 格</option>
              <option value="grid-15" ${gridType==='grid-15'?'selected':''}>15 格</option>
            </select>
          </div>
          <div class="action-group">
            <div class="batch-upload-btn-wrapper">
              📷 批次上傳圖片
              <input type="file" multiple accept="image/*" onchange="batchUploadImages('${pageId}', this)">
            </div>
            <button class="btn-action btn-export-jpg" onclick="exportToJPG('${pageId}')">🖼️ 導出 JPG</button>
            <button class="btn-action btn-delete-page" onclick="deletePage('${pageId}')">刪除頁面</button>
          </div>
        </div>
        <div class="poster-container" id="poster-${pageId}">
          <div class="header-zone">
            <div class="logo-upload-area">
              <span class="logo-placeholder">上傳 Logo</span>
              <img src="" style="display:none;" />
              <input type="file" accept="image/*" onchange="uploadLogo(this)">
            </div>
            <div class="main-title">
              <h1 contenteditable="true">高價買取中</h1>
              <div class="subtitle" contenteditable="true">BAN-TYO TCG</div>
            </div>
            <div class="date-badge">
              <div contenteditable="true">${dateText}</div>
              <span>更新</span>
            </div>
          </div>
          <div class="card-grid ${gridType}" id="grid-${pageId}"></div>
          <div class="footer-notes" contenteditable="true">
            註： 收購價僅適用於完好無損卡牌。價格隨市場變動，收滿即止。
          </div>
        </div>
      `;

      wrapper.appendChild(pageElement);
      renderGridItems(pageId, parseInt(gridType.replace('grid-', '')) || 12);
    }

    function renderGridItems(pageId, count) {
      const gridContainer = document.getElementById(`grid-${pageId}`);
      gridContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.draggable = true;
        item.innerHTML = `
          <div class="image-container">
            <img src="" style="display:none;" />
            <div class="phone-upload-btn">
              📷 <input type="file" accept="image/*" onchange="uploadSingleCardImage(this)">
            </div>
          </div>
          <div class="card-info" contenteditable="true">卡牌名稱 / 編號</div>
          <div class="price-tag">
            <div class="price-label">買取<br>HKD</div>
            <div class="price-tag-value" contenteditable="true">$00</div>
          </div>
        `;
        bindDragEvents(item);
        gridContainer.appendChild(item);
      }
    }

    function changeGrid(pageId, gridType) {
      const gridContainer = document.getElementById(`grid-${pageId}`);
      gridContainer.className = `card-grid ${gridType}`;
      const count = parseInt(gridType.replace('grid-', ''));
      renderGridItems(pageId, count);
    }

    function deletePage(pageId) {
      const page = document.getElementById(pageId);
      if (page && confirm('確定要刪除此頁面嗎？')) {
        page.remove();
      }
    }

    function uploadSingleCardImage(input) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], function (compressedSrc) {
          const img = input.closest('.image-container').querySelector('img');
          img.src = compressedSrc;
          img.style.display = 'block';
        });
      }
    }

    function batchUploadImages(pageId, input) {
      const files = Array.from(input.files);
      if (!files.length) return;
      const cardItems = document.querySelectorAll(`#grid-${pageId} .card-item`);
      files.forEach((file, index) => {
        if (index < cardItems.length) {
          compressImage(file, function (compressedSrc) {
            const img = cardItems[index].querySelector('.image-container img');
            img.src = compressedSrc;
            img.style.display = 'block';
          });
        }
      });
    }

    function uploadLogo(input) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], function (compressedSrc) {
          const container = input.closest('.logo-upload-area');
          const img = container.querySelector('img');
          const placeholder = container.querySelector('.logo-placeholder');
          img.src = compressedSrc;
          img.style.display = 'block';
          if (placeholder) placeholder.style.display = 'none';
        });
      }
    }

    let draggedItem = null;
    function bindDragEvents(item) {
      item.addEventListener('dragstart', function () {
        draggedItem = item;
        setTimeout(() => item.classList.add('dragging'), 0);
      });
      item.addEventListener('dragend', function () {
        item.classList.remove('dragging');
        draggedItem = null;
      });
      item.addEventListener('dragover', function (e) {
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', function () {
        item.classList.remove('drag-over');
      });
      item.addEventListener('drop', function (e) {
        e.preventDefault();
        item.classList.remove('drag-over');
        if (draggedItem && draggedItem !== item) {
          const grid = item.parentNode;
          const items = Array.from(grid.children);
          const draggedIdx = items.indexOf(draggedItem);
          const targetIdx = items.indexOf(item);
          if (draggedIdx < targetIdx) {
            grid.insertBefore(draggedItem, item.nextSibling);
          } else {
            grid.insertBefore(draggedItem, item);
          }
        }
      });
    }

    function exportToJPG(pageId) {
      const poster = document.getElementById(`poster-${pageId}`);
      poster.classList.add('exporting-jpg');
      html2canvas(poster, { scale: 2, useCORS: true, logging: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${pageId}-buyback.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        poster.classList.remove('exporting-jpg');
      }).catch(err => {
        console.error('JPG 匯出失敗:', err);
        poster.classList.remove('exporting-jpg');
      });
    }

    function printAllPages() {
      window.print();
    }

    window.onload = function() {
      addNewPage();
    };
  </script>
</body>
</html>
